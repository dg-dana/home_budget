<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Home Budget</title>
    <script>
      // Runs before first paint so a device set to dark never flashes the light
      // palette while React boots. Mirrors applyTheme() in src/theme.ts — change
      // one and change the other. No attribute means "follow the OS".
      try {
        var stored = localStorage.getItem('home-budget:theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch (err) {
        /* localStorage can throw in private mode; the OS default is fine. */
      }

      // Same idea for the language: <html lang> is what a screen reader reads
      // and what the browser's own "translate this page?" prompt keys off, so
      // it has to be right before React boots. Mirrors readLanguage() and
      // applyLanguage() in src/language.ts — change one and change the other.
      try {
        var picked = localStorage.getItem('home-budget:language');
        if (picked !== 'en' && picked !== 'de') {
          var tags = navigator.languages || [navigator.language];
          picked = Array.prototype.some.call(tags, function (tag) {
            return String(tag).toLowerCase().indexOf('de') === 0;
          })
            ? 'de'
            : 'en';
        }
        document.documentElement.lang = picked;
      } catch (err) {
        /* Same again: the markup already says lang="en". */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
