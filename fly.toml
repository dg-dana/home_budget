# Fly.io configuration.
#
# IMPORTANT: this app stores everything in a SQLite file on the attached
# volume, so it must run on EXACTLY ONE machine. Two machines would each get
# their own volume and their own divergent copy of your data, with no error to
# warn you. Never `fly scale count` above 1.

app = 'home-budget'          # change to your own unique app name
primary_region = 'ams'       # change to the region nearest you (fly platform regions)

[build]

[env]
  PORT = '8080'
  NODE_ENV = 'production'
  DATABASE_PATH = '/data/home-budget.sqlite'

# The persistent volume. Create it once with:
#   fly volumes create data --size 1 --region <your region>
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true

  # Keep one machine alive. The app is cheap to run and a share link opened by
  # a guest should not wait on a cold start.
  #
  # To trade a little latency for a lower bill, set:
  #   auto_stop_machines = 'stop'
  #   min_machines_running = 0
  # Nothing is lost while stopped: recurring expenses materialise on read, so
  # they catch up on the next request (see ARCHITECTURE.md §7).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  # Measured peak is ~85 MB RSS under load against 14,400 expenses, so 256 MB
  # leaves roughly 3x headroom.
  memory = '256mb'
  cpus = 1
