name: Deploy to Lightsail

# Builds the image here and ships it to the server, so the instance never has
# to compile anything — a 512 MB box would struggle with a Vite build.
#
# The whole thing runs from the Actions tab: no terminal, no local install.
#
# Required repository secrets (see DEPLOY.md):
#   LIGHTSAIL_HOST     public IP of the instance
#   LIGHTSAIL_SSH_KEY  private key downloaded from Lightsail
# Optional:
#   LIGHTSAIL_USER     login user, defaults to "ubuntu"

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Deploy without running tests first (not recommended)'
        type: boolean
        default: false

concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are configured
        run: |
          missing=
          [ -z "${{ secrets.LIGHTSAIL_HOST }}" ]    && missing="$missing LIGHTSAIL_HOST"
          [ -z "${{ secrets.LIGHTSAIL_SSH_KEY }}" ] && missing="$missing LIGHTSAIL_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see DEPLOY.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_tests }}
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ !inputs.skip_tests }}
        run: npm ci

      - name: Typecheck
        if: ${{ !inputs.skip_tests }}
        run: npm run typecheck

      - name: Server tests
        if: ${{ !inputs.skip_tests }}
        run: npm test

      # --- build and publish the image -----------------------------------
      - name: Work out the image name
        id: image
        run: |
          # GHCR requires a lowercase path.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Lightsail's standard blueprints are x86.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- ship it to the server ------------------------------------------
      - name: Set up SSH
        env:
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy the compose file and Caddyfile
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          scp -i ~/.ssh/id_deploy deploy/docker-compose.yml deploy/Caddyfile \
            "$USER_NAME@$HOST:/opt/home-budget/"

      - name: Pull and restart
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          IMAGE: ${{ steps.image.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          # The registry token is short-lived and scoped to this run, so no
          # long-lived credential ends up sitting on the server.
          ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" bash -s <<EOF
            set -euo pipefail
            cd /opt/home-budget

            echo '$REGISTRY_TOKEN' | sudo docker login ghcr.io -u '$REGISTRY_USER' --password-stdin

            # Record which image is deployed. Rolling back is editing this line
            # to an older tag and re-running 'docker compose up -d'.
            sed -i '/^APP_IMAGE=/d' .env
            echo 'APP_IMAGE=$IMAGE' >> .env

            # The mail key, from the repository secret of the same name. An
            # empty secret writes an empty line, which the app reads as "no
            # provider" and falls back to showing links on screen. Never
            # echoed: Actions masks the value, but .env is the only place it
            # should exist on the server.
            sed -i '/^RESEND_API_KEY=/d' .env
            echo 'RESEND_API_KEY=$RESEND_API_KEY' >> .env

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans

            # Caddy will not have been touched by the line above. Compose only
            # recreates a container when its *service definition* changes, and
            # the Caddyfile is a bind-mounted file — editing its contents leaves
            # the definition identical, so the container is left alone and Caddy
            # never re-reads the file. A deploy that changed the Caddyfile would
            # report success while the old config kept serving. Reload it
            # explicitly; \`< /dev/null\` because this script is on the remote
            # shell's stdin and \`exec\` would otherwise eat the rest of it.
            if sudo docker compose exec -T caddy \\
                 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile < /dev/null; then
              echo 'Caddy reloaded its configuration.'
            else
              echo 'Graceful reload failed; restarting Caddy instead.'
              sudo docker compose restart caddy
            fi

            sudo docker image prune -f
            sudo docker logout ghcr.io
          EOF

      # The app container publishes nothing to the host (compose says `expose`,
      # not `ports`), so this has to run inside the container. An earlier
      # version tried `curl http://127.0.0.1:8080` on the host first, which
      # could never succeed and quietly fell through to this.
      - name: Wait for the app container to come up
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
                 "cd /opt/home-budget && sudo docker compose exec -T app node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" 2>/dev/null; then
              echo "App healthy after $attempt attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The app container did not become healthy. Run the 'Diagnose the deployment' workflow."
          exit 1

      # The check above only proves the Node process is alive inside its own
      # container. It says nothing about Caddy, the certificate, the firewall or
      # DNS — every part a visitor actually depends on. Checking the real URL
      # from outside is the only thing that answers "is the website up?", so a
      # deploy is not considered finished until this passes.
      - name: Verify the public URL works
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          domain=$(ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
            "grep '^DOMAIN=' /opt/home-budget/.env | cut -d= -f2")
          if [ -z "$domain" ]; then
            echo "::error::No DOMAIN in /opt/home-budget/.env — re-run deploy/bootstrap.sh."
            exit 1
          fi
          echo "Checking https://$domain/api/health from outside the server."

          # On a first deploy Caddy has to complete the ACME challenge, which
          # takes a little while, so this is patient before giving up.
          for attempt in $(seq 1 30); do
            code=$(curl -fsS --max-time 15 -o /dev/null -w '%{http_code}' \
              "https://$domain/api/health" 2>/dev/null) && [ "$code" = "200" ] && {
              echo "Public HTTPS is serving (attempt $attempt)."
              # Nothing should advertise a protocol the firewall drops.
              altsvc=$(curl -fsSI --max-time 15 "https://$domain/" 2>/dev/null \
                | grep -i '^alt-svc:' || true)
              if [ -n "$altsvc" ]; then
                echo "::warning::Caddy is advertising $altsvc — if UDP 443 is not open, phones may hang. See deploy/Caddyfile."
              fi
              exit 0
            }
            sleep 10
          done

          echo "::error::The app container is healthy but https://$domain is not serving."
          echo "The failure is between the internet and Caddy: certificate, firewall or DNS."
          echo "Run the 'Diagnose the deployment' workflow for the details."
          exit 1

      - name: Report where it is
        if: always()
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          domain=$(ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
            "grep '^DOMAIN=' /opt/home-budget/.env | cut -d= -f2" || echo '')
          {
            echo "### Deployed"
            echo ""
            [ -n "$domain" ] && echo "Your app: https://$domain"
            echo ""
            echo "Image: \`${{ steps.image.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
