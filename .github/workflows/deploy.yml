name: Deploy to Lightsail

# Builds the image here and ships it to the server, so the instance never has
# to compile anything — a 512 MB box would struggle with a Vite build.
#
# The whole thing runs from the Actions tab: no terminal, no local install.
#
# Required repository secrets (see DEPLOY.md):
#   LIGHTSAIL_HOST     public IP of the instance
#   LIGHTSAIL_SSH_KEY  private key downloaded from Lightsail
# Optional:
#   LIGHTSAIL_USER     login user, defaults to "ubuntu"

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Deploy without running tests first (not recommended)'
        type: boolean
        default: false

concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are configured
        run: |
          missing=
          [ -z "${{ secrets.LIGHTSAIL_HOST }}" ]    && missing="$missing LIGHTSAIL_HOST"
          [ -z "${{ secrets.LIGHTSAIL_SSH_KEY }}" ] && missing="$missing LIGHTSAIL_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see DEPLOY.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_tests }}
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ !inputs.skip_tests }}
        run: npm ci

      - name: Typecheck
        if: ${{ !inputs.skip_tests }}
        run: npm run typecheck

      - name: Server tests
        if: ${{ !inputs.skip_tests }}
        run: npm test

      # --- build and publish the image -----------------------------------
      - name: Work out the image name
        id: image
        run: |
          # GHCR requires a lowercase path.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Lightsail's standard blueprints are x86.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- ship it to the server ------------------------------------------
      - name: Set up SSH
        env:
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy the compose file and Caddyfile
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          scp -i ~/.ssh/id_deploy deploy/docker-compose.yml deploy/Caddyfile \
            "$USER_NAME@$HOST:/opt/home-budget/"

      - name: Pull and restart
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          IMAGE: ${{ steps.image.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The registry token is short-lived and scoped to this run, so no
          # long-lived credential ends up sitting on the server.
          ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" bash -s <<EOF
            set -euo pipefail
            cd /opt/home-budget

            echo '$REGISTRY_TOKEN' | sudo docker login ghcr.io -u '$REGISTRY_USER' --password-stdin

            # Record which image is deployed. Rolling back is editing this line
            # to an older tag and re-running 'docker compose up -d'.
            sed -i '/^APP_IMAGE=/d' .env
            echo 'APP_IMAGE=$IMAGE' >> .env

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
            sudo docker logout ghcr.io
          EOF

      - name: Wait for it to come up
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
                 "curl -fsS -o /dev/null http://127.0.0.1:8080/api/health" 2>/dev/null \
               || ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
                 "sudo docker compose -f /opt/home-budget/docker-compose.yml exec -T app node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" 2>/dev/null; then
              echo "Healthy after $attempt attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The app did not become healthy. Check: sudo docker compose -f /opt/home-budget/docker-compose.yml logs"
          exit 1

      - name: Report where it is
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          domain=$(ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
            "grep '^DOMAIN=' /opt/home-budget/.env | cut -d= -f2" || echo '')
          {
            echo "### Deployed"
            echo ""
            [ -n "$domain" ] && echo "Your app: https://$domain"
            echo ""
            echo "Image: \`${{ steps.image.outputs.tag }}\`"
            echo ""
            echo "If this was the first deploy, Caddy may take a minute to issue the certificate."
          } >> "$GITHUB_STEP_SUMMARY"
