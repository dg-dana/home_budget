name: Nightly backup

# Takes a consistent SQLite snapshot on the server and pulls it down as a
# GitHub artifact, so a copy of the data exists somewhere other than the disk
# it came from.
#
# Uses the same secrets as the deploy workflow, so it starts working as soon as
# those are set. Until then it exits cleanly rather than failing every night.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch: # also runnable on demand

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check the secrets are configured
        id: guard
        run: |
          if [ -z "${{ secrets.LIGHTSAIL_HOST }}" ] || [ -z "${{ secrets.LIGHTSAIL_SSH_KEY }}" ]; then
            echo "LIGHTSAIL_HOST / LIGHTSAIL_SSH_KEY not set — skipping. See DEPLOY.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.guard.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Take a snapshot on the server
        if: steps.guard.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          # Runs inside the app container, using SQLite's online backup API —
          # safe while the app is serving traffic. See server/src/backup.ts.
          ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
            "cd /opt/home-budget && sudo docker compose exec -T app node server/dist/backup.js"

      - name: Fetch the newest snapshot
        if: steps.guard.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          newest=$(ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
            "sudo ls -1 /opt/home-budget/data/backups/*.sqlite | sort | tail -1" | tr -d '\r')
          echo "Newest snapshot: $newest"

          # Copy to somewhere readable before pulling it down; the backups
          # directory is written by root inside the container.
          ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
            "sudo cp '$newest' /tmp/home-budget-backup.sqlite && sudo chown \$USER /tmp/home-budget-backup.sqlite"
          scp -i ~/.ssh/id_deploy "$USER_NAME@$HOST:/tmp/home-budget-backup.sqlite" ./home-budget-backup.sqlite
          ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" "rm -f /tmp/home-budget-backup.sqlite"
          ls -la ./home-budget-backup.sqlite

      - name: Check it is a valid database
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          result=$(sqlite3 ./home-budget-backup.sqlite 'PRAGMA integrity_check;')
          echo "integrity_check: $result"
          if [ "$result" != "ok" ]; then
            echo "::error::The snapshot failed its integrity check — do not rely on it."
            exit 1
          fi
          echo "households: $(sqlite3 ./home-budget-backup.sqlite 'SELECT COUNT(*) FROM households;')"
          echo "expenses:   $(sqlite3 ./home-budget-backup.sqlite 'SELECT COUNT(*) FROM expenses;')"

      - name: Upload it
        if: steps.guard.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: home-budget-backup-${{ github.run_id }}
          path: home-budget-backup.sqlite
          retention-days: 90
